<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8ff; --card: rgba(255,255,255,0.72); --stroke: rgba(40,60,110,0.12);
      --text: #111827; --text-2: #5b6478; --accent: #2f6bff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c1020; --card: rgba(26,32,53,0.7); --stroke: rgba(255,255,255,0.1);
              --text: #f2f4fa; --text-2: #a8b0c4; --accent: #7fa6ff; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 18px;
    }
    .card {
      background: var(--card); border: 1px solid var(--stroke);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
      backdrop-filter: blur(14px);
    }
    h1 { font-size: 17px; margin-bottom: 4px; }
    h2 { font-size: 13px; color: var(--text-2); font-weight: 500; margin-bottom: 12px; }
    p { color: var(--text-2); margin-bottom: 10px; }
    .accent { color: var(--accent); font-weight: 600; }
  </style>
  <title>Media player</title>
  <style>
    .stage { aspect-ratio: 16/9; max-height: 220px; border-radius: 14px; display: grid; place-items: center;
             background: linear-gradient(135deg, #2f6bff, #7c5cff); color: #fff; margin-bottom: 14px; }
    .stage button { font-size: 34px; background: rgba(255,255,255,0.2); border: 0; color: #fff;
                    width: 68px; height: 68px; border-radius: 50%; cursor: pointer; }
    .bar { height: 4px; border-radius: 3px; background: var(--stroke); overflow: hidden; margin-bottom: 6px; }
    .bar i { display: block; height: 100%; width: 38%; background: var(--accent); }
    .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); }
    .track { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--stroke); }
    .dot { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); opacity: 0.18; }
  </style>
</head>
<body>
  <div class="card">
    <div class="stage"><button id="play" aria-label="Play">▶</button></div>
    <h1>Keeping playback alive</h1>
    <h2 id="status">Paused — tap play, then work in the other pane</h2>
    <div class="bar"><i></i></div>
    <div class="times"><span>1:24</span><span>3:41</span></div>
  </div>
  <div class="card">
    <h1>Up next</h1>
    <div class="track"><div class="dot"></div><div><strong>Split screen, done right</strong><br><span style="color:var(--text-2)">4:02</span></div></div>
    <div class="track"><div class="dot"></div><div><strong>Three panes at once</strong><br><span style="color:var(--text-2)">2:18</span></div></div>
    <div class="track"><div class="dot"></div><div><strong>App pairs</strong><br><span style="color:var(--text-2)">5:37</span></div></div>
  </div>
  <script>
    const button = document.getElementById('play');
    const status = document.getElementById('status');
    let playing = false;
    button.addEventListener('click', () => {
      playing = !playing;
      button.textContent = playing ? '❚❚' : '▶';
      status.textContent = playing
        ? 'Playing — this keeps running while you use the other pane'
        : 'Paused — tap play, then work in the other pane';
    });
  </script>
</body>
</html>

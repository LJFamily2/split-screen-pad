<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Interactive simulator for Split Pad — the split-screen multitasking app for Android tablets.">
  <title>Split Pad — Split Screen Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232f6bff%27/%3E%3Crect x=%277%27 y=%278%27 width=%277%27 height=%2716%27 rx=%272%27 fill=%27white%27/%3E%3Crect x=%2718%27 y=%278%27 width=%277%27 height=%2716%27 rx=%272%27 fill=%27white%27 opacity=%270.75%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">◧</div>
      <div>
        <div class="brand-name">Split Pad</div>
        <div class="brand-sub">Redmi Pad SE 8.7 simulator</div>
      </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Split controls">
      <div class="seg" role="group" aria-label="Split ratio">
        <button class="btn" id="btn-ratio-33" data-ratio="0.3333">1/3</button>
        <button class="btn active" id="btn-ratio-50" data-ratio="0.5">1/2</button>
        <button class="btn" id="btn-ratio-66" data-ratio="0.6667">2/3</button>
      </div>

      <div class="sep"></div>

      <button class="btn" id="btn-swap" title="Swap the two panes (Ctrl+E)">⇄ Swap</button>
      <button class="btn" id="btn-rotate" title="Rotate split direction (Ctrl+D)">⟲ Rotate</button>
      <button class="btn" id="btn-apps" title="Pick two apps to split">▦ Apps</button>
      <button class="btn" id="btn-save-pair" title="Save the current pair">★ Save pair</button>
      <button class="btn" id="btn-pairs" title="Open a saved pair">🗂 Pairs</button>
      <div class="seg" role="group" aria-label="Pane count">
        <button class="btn active" id="btn-layout-2" title="Two panes">▤ 2 panes</button>
        <button class="btn" id="btn-layout-3" title="One half, plus two stacked">▥ 3 panes</button>
      </div>
    </div>

    <button class="btn-icon" id="btn-theme" title="Theme: follows your device" aria-label="Change theme">🌗</button>
    <button class="btn-icon" id="btn-help" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
  </header>

  <main class="stage">
    <div class="bezel">
      <div class="camera-dot"></div>

      <div class="screen" id="screen">

        <!-- Edge dock: tap an app, choose where it goes -->
        <aside class="dock" id="dock" aria-label="App dock">
          <button class="dock-toggle" id="dock-toggle" aria-label="Collapse dock">⋮</button>
          <div class="dock-items" id="dock-items"></div>
        </aside>

        <!-- The split itself -->
        <div class="split vertical" id="split">
            <section class="pane active" id="pane-1" aria-label="Pane 1">
              <div class="pane-bar">
                <button class="pane-badge" data-focus="1">PANE 1</button>
                <button class="btn-icon" data-nav="back" data-pane="1" title="Back">‹</button>
                <button class="btn-icon" data-nav="forward" data-pane="1" title="Forward">›</button>
                <button class="btn-icon" data-nav="reload" data-pane="1" title="Reload">↻</button>
                <input class="url-field" id="url-1" type="text" spellcheck="false"
                       placeholder="Search or type a web address" aria-label="Pane 1 address">
                <button class="ua-toggle" id="ua-1" title="Switch between the mobile and desktop site">Mobile</button>
                <button class="btn-icon" data-menu="1" title="Pane options">⋮</button>
              </div>
              <div class="pane-progress" id="progress-1"></div>
              <div class="viewport">
                <iframe id="frame-1" title="Pane 1 content"
                        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
                <div class="embed-block" id="block-1">
                  <div class="eb-icon">🔒</div>
                  <h4 id="block-title-1">This site blocks embedding</h4>
                  <p id="block-text-1"></p>
                  <button class="btn" data-open-tab="1">Open in a new tab</button>
                </div>
              </div>
            </section>
            <div class="divider" id="divider" role="separator" tabindex="0"
                 aria-label="Drag to resize, double-tap to swap, tap for options">
              <div class="divider-pill"></div>
              <div class="ratio-tip" id="ratio-tip">50 : 50</div>
            </div>
            <div class="secondary-group" id="secondary-group">
              <section class="pane" id="pane-2" aria-label="Pane 2">
                <div class="pane-bar">
                  <button class="pane-badge" data-focus="2">PANE 2</button>
                  <button class="btn-icon" data-nav="back" data-pane="2" title="Back">‹</button>
                  <button class="btn-icon" data-nav="forward" data-pane="2" title="Forward">›</button>
                  <button class="btn-icon" data-nav="reload" data-pane="2" title="Reload">↻</button>
                  <input class="url-field" id="url-2" type="text" spellcheck="false"
                         placeholder="Search or type a web address" aria-label="Pane 2 address">
                  <button class="ua-toggle" id="ua-2" title="Switch between the mobile and desktop site">Mobile</button>
                  <button class="btn-icon" data-menu="2" title="Pane options">⋮</button>
                </div>
                <div class="pane-progress" id="progress-2"></div>
                <div class="viewport">
                  <iframe id="frame-2" title="Pane 2 content"
                          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
                  <div class="embed-block" id="block-2">
                    <div class="eb-icon">🔒</div>
                    <h4 id="block-title-2">This site blocks embedding</h4>
                    <p id="block-text-2"></p>
                    <button class="btn" data-open-tab="2">Open in a new tab</button>
                  </div>
                </div>
              </section>
              <div class="divider" id="divider-2" role="separator" tabindex="0"
                   aria-label="Drag to resize the stacked panes">
                <div class="divider-pill"></div>
                <div class="ratio-tip" id="ratio-tip-2">50 : 50</div>
              </div>
              <section class="pane" id="pane-3" aria-label="Pane 3">
                <div class="pane-bar">
                  <button class="pane-badge" data-focus="3">PANE 3</button>
                  <button class="btn-icon" data-nav="back" data-pane="3" title="Back">‹</button>
                  <button class="btn-icon" data-nav="forward" data-pane="3" title="Forward">›</button>
                  <button class="btn-icon" data-nav="reload" data-pane="3" title="Reload">↻</button>
                  <input class="url-field" id="url-3" type="text" spellcheck="false"
                         placeholder="Search or type a web address" aria-label="Pane 3 address">
                  <button class="ua-toggle" id="ua-3" title="Switch between the mobile and desktop site">Mobile</button>
                  <button class="btn-icon" data-menu="3" title="Pane options">⋮</button>
                </div>
                <div class="pane-progress" id="progress-3"></div>
                <div class="viewport">
                  <iframe id="frame-3" title="Pane 3 content"
                          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
                  <div class="embed-block" id="block-3">
                    <div class="eb-icon">🔒</div>
                    <h4 id="block-title-3">This site blocks embedding</h4>
                    <p id="block-text-3"></p>
                    <button class="btn" data-open-tab="3">Open in a new tab</button>
                  </div>
                </div>
              </section>
            </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Two-step app picker -->
  <div class="modal" id="picker-modal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="modal-head">
        <span class="step-badge" id="picker-step">Step 1 of 2</span>
        <h3 id="picker-title">Choose the first app</h3>
        <button class="btn-icon" id="picker-back" hidden title="Back to step 1">‹</button>
        <button class="btn-icon" data-close-modal="picker-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="picker-search" placeholder="Search apps and web apps" aria-label="Search apps">
        </div>
        <p class="modal-desc" id="picker-desc">Pick what goes in Pane 1.</p>
        <div class="app-grid" id="picker-grid"></div>
      </div>
    </div>
  </div>

  <!-- Saved pairs -->
  <div class="modal" id="pairs-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pairs-title">
      <div class="modal-head">
        <h3 id="pairs-title">Your app pairs</h3>
        <button class="btn-icon" data-close-modal="pairs-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="pairs-list"></div>
    </div>
  </div>

  <!-- Generic action sheet: divider menu, pane menu, placement menu -->
  <div class="modal" id="action-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="action-title">
      <div class="modal-head">
        <h3 id="action-title">Options</h3>
        <button class="btn-icon" data-close-modal="action-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="action-list" id="action-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="simulator.js"></script>
</body>
</html>
